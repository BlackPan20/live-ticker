<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnier-Zentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;
    --surface:#151A21;
    --surface-2:#1B222C;
    --surface-3:#212A36;
    --border:#262E3A;
    --text:#F2F4F7;
    --text-muted:#8B93A1;
    --text-faint:#5B6472;
    --accent:#4C7CF0;
    --accent-dim:#28376B;
    --live:#FFB020;
    --live-dim:#4A3A15;
    --success:#3DDC84;
    --danger:#FF5C6C;
    --radius:12px;
    --radius-sm:8px;
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(76,124,240,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,176,32,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--accent);color:#fff;}

  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:16px;
    padding:14px 22px;
    background:rgba(14,17,22,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#2a3f8f);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;font-size:18px;
    flex-shrink:0;
  }
  .brand-name{
    font-family:var(--font-display);font-weight:700;font-size:22px;
    letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand-name input{
    background:transparent;border:none;color:var(--text);
    font-family:var(--font-display);font-weight:700;font-size:22px;
    letter-spacing:0.3px;width:100%;border-bottom:1px dashed transparent;
  }
  .brand-name input:focus{outline:none;border-bottom-color:var(--accent);}
  .phase-pill{
    font-family:var(--font-mono);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.08em;
    padding:5px 10px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    white-space:nowrap;
  }
  .nav{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border);}
  .nav button{
    background:transparent;border:none;color:var(--text-muted);
    padding:8px 16px;border-radius:8px;font-weight:600;font-size:14px;
    transition:all .15s ease;
  }
  .nav button.active{background:var(--accent);color:#fff;}
  .nav button:not(.active):hover{color:var(--text);background:var(--surface-3);}

  main{max-width:1180px;margin:0 auto;padding:28px 22px 80px;}

  /* ---------- Basics ---------- */
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:20px;
  }
  .card + .card{margin-top:16px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0 0 4px;letter-spacing:0.2px;}
  h2{font-size:26px;}
  h3{font-size:19px;}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);
    text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px;
  }
  .muted{color:var(--text-muted);font-size:14px;}
  .section-head{margin-bottom:18px;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-3);border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#3c69dd;}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:rgba(255,92,108,0.1);}
  .btn-sm{padding:6px 11px;font-size:13px;}
  .btn-block{width:100%;justify-content:center;}

  input[type=text],input[type=number],input[type=password]{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:8px;font-size:14px;
  }
  input:focus{outline:none;border-color:var(--accent);}
  input[type=number]{width:56px;text-align:center;font-family:var(--font-mono);font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{
    text-align:left;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.06em;color:var(--text-faint);font-weight:600;
    padding:8px 10px;border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .num-col{text-align:center;font-family:var(--font-mono);}
  .team-cell{display:flex;align-items:center;gap:8px;}
  .avatar{
    width:24px;height:24px;border-radius:6px;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--text-muted);
    flex-shrink:0;
  }

  .tag{
    display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
    font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.05em;
  }
  .tag-live{background:var(--live-dim);color:var(--live);}
  .tag-done{background:rgba(61,220,132,0.12);color:var(--success);}
  .tag-pending{background:var(--surface-3);color:var(--text-faint);}

  /* ---------- Scoreboard flip tiles (signature element) ---------- */
  .score-row{display:flex;align-items:center;gap:10px;justify-content:center;}
  .flip-tile{
    font-family:var(--font-mono);font-weight:700;font-size:20px;
    background:linear-gradient(180deg,#1c2430,#141a22);
    border:1px solid var(--border);border-radius:6px;
    width:38px;height:40px;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), inset 0 -6px 10px rgba(0,0,0,0.35);
    position:relative;overflow:hidden;
  }
  .flip-tile::after{
    content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,0.5);
  }
  .flip-tile.pulse{animation:tilePulse .6s ease;}
  @keyframes tilePulse{
    0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,176,32,0.0);}
    30%{transform:scale(1.12);color:var(--live);border-color:var(--live);box-shadow:0 0 14px 2px rgba(255,176,32,0.35);}
    100%{transform:scale(1);}
  }
  .score-sep{font-family:var(--font-mono);color:var(--text-faint);font-weight:700;}

  /* ---------- Ticker marquee ---------- */
  .marquee-wrap{
    background:linear-gradient(90deg,#0c1420,#141d2c);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:0;overflow:hidden;position:relative;margin-bottom:18px;
  }
  .marquee-label{
    position:absolute;left:0;top:0;bottom:0;z-index:2;
    background:var(--live);color:#1a1200;font-family:var(--font-mono);font-weight:700;font-size:12px;
    display:flex;align-items:center;gap:6px;padding:0 16px;letter-spacing:0.08em;
  }
  .marquee-dot{width:7px;height:7px;border-radius:50%;background:#1a1200;animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
  .marquee-track{display:flex;white-space:nowrap;padding:14px 0 14px 128px;animation:scroll-left 28s linear infinite;}
  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}
  @keyframes scroll-left{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  .marquee-item{
    display:inline-flex;align-items:center;gap:10px;padding:0 26px;
    border-right:1px solid var(--border);font-family:var(--font-mono);font-size:14px;
  }
  .marquee-item b{font-weight:700;}
  .marquee-empty{padding:20px;color:var(--text-muted);font-size:14px;}

  /* ---------- Groups ---------- */
  .group-card h3{display:flex;align-items:center;justify-content:space-between;}
  .standings-row.qualified td:first-child{box-shadow:inset 3px 0 0 var(--success);}
  .match-line{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .match-line:last-child{border-bottom:none;}
  .match-teams{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .match-teams span{font-size:14px;font-weight:600;}
  .match-teams .vs{color:var(--text-faint);font-weight:400;font-size:12px;}
  .match-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .goal-controls{display:flex;align-items:center;gap:6px;}
  .goal-btn{width:26px;height:26px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1;}
  .goal-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .goal-count{min-width:16px;text-align:center;font-weight:700;font-size:15px;}

  /* ---------- Bracket ---------- */
  .bracket{display:flex;gap:34px;overflow-x:auto;padding:8px 4px 20px;}
  .bracket-round{display:flex;flex-direction:column;justify-content:space-around;min-width:220px;gap:22px;}
  .bracket-round-title{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;
    color:var(--text-faint);text-align:center;margin-bottom:6px;
  }
  .bmatch{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;position:relative;
  }
  .bmatch-team{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:14px;}
  .bmatch-team.winner{font-weight:700;color:var(--success);}
  .bmatch-team.tbd{color:var(--text-faint);font-style:italic;}
  .bmatch-team button.pick{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    border-radius:6px;padding:2px 8px;font-size:11px;font-family:var(--font-mono);
  }
  .bmatch-team button.pick:hover{border-color:var(--success);color:var(--success);}
  .bmatch-score{font-family:var(--font-mono);font-weight:700;}
  .bmatch-div{height:1px;background:var(--border);margin:2px 0;}
  .champion-banner{
    text-align:center;padding:50px 20px;
    background:radial-gradient(circle at center, rgba(255,176,32,0.12), transparent 70%);
    border:1px solid var(--live-dim);border-radius:var(--radius);
  }
  .champion-banner .trophy{font-size:52px;margin-bottom:8px;}
  .champion-banner h2{font-size:40px;background:linear-gradient(90deg,#fff,var(--live));-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- Admin ---------- */
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .step-pill{
    font-family:var(--font-mono);font-size:12px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);color:var(--text-faint);
  }
  .step-pill.current{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .step-pill.done{color:var(--success);}
  .team-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
  .team-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);padding:8px 12px;border-radius:8px;}
  .team-row span{flex:1;font-weight:600;}
  .inline-form{display:flex;gap:10px;}
  .inline-form input{flex:1;}
  .field-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .field-row label{font-size:14px;color:var(--text-muted);min-width:210px;}
  .lock-screen{max-width:360px;margin:60px auto;text-align:center;}
  .lock-screen .card{text-align:left;}
  .qual-check{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;}
  .qual-check:hover{background:var(--surface-2);}
  .qual-check input{width:18px;height:18px;accent-color:var(--success);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-muted);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}
  .footer-note{margin-top:40px;text-align:center;color:var(--text-faint);font-size:12px;font-family:var(--font-mono);}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--surface-3);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:14px;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .search-box{position:relative;margin-bottom:16px;}
  .search-box input{width:100%;padding:10px 14px;}
  @media(max-width:640px){
    .topbar{flex-wrap:wrap;}
    .nav{width:100%;justify-content:space-between;}
    .nav button{flex:1;padding:8px 6px;font-size:13px;}
    .field-row{flex-direction:column;align-items:flex-start;gap:4px;}
    .field-row label{min-width:0;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div class="brand-name" id="brand-name-slot"></div>
    </div>
    <span class="phase-pill" id="phase-pill"></span>
    <div class="nav" id="main-nav">
      <button data-tab="ticker">Ticker</button>
      <button data-tab="player">Spieler</button>
      <button data-tab="admin">Admin</button>
    </div>
  </div>
  <main id="view-root"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   STATE
========================================================= */
const STORAGE_KEY = 'tournament-state-v1';
let state = null;
let currentTab = 'ticker';
let adminUnlocked = false;
let lastScoreSnapshot = {};
let pollTimer = null;

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultState(){
  return {
    v: 1,
    tournamentName: 'Sommer-Cup 2026',
    phase: 'setup', // setup | group | knockout-select | knockout | finished
    teams: [],
    groupCount: 2,
    advancePerGroup: 2,
    groups: [],
    matches: [],
    knockout: { rounds: [] },
    champion: null,
    adminPin: '1234',
    updatedAt: Date.now()
  };
}

async function loadState(remoteOnly){
  try{
    const r = await window.storage.get(STORAGE_KEY, true);
    if(r && r.value){ return JSON.parse(r.value); }
  }catch(e){ /* not found yet */ }
  return remoteOnly ? null : defaultState();
}
async function saveState(){
  state.updatedAt = Date.now();
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  }catch(e){ console.error('Speichern fehlgeschlagen', e); showToast('Speichern fehlgeschlagen — bitte erneut versuchen'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================
   TOURNAMENT LOGIC HELPERS
========================================================= */
function teamById(id){ return state.teams.find(t=>t.id===id); }
function teamName(id){ if(!id) return 'Freilos'; const t=teamById(id); return t? t.name : '—'; }
function teamInitials(name){
  return (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function assignGroups(){
  const shuffled = shuffle(state.teams.map(t=>t.id));
  const groups = [];
  for(let i=0;i<state.groupCount;i++){
    groups.push({ id: uid('g'), name: 'Gruppe ' + String.fromCharCode(65+i), teamIds: [] });
  }
  shuffled.forEach((id,idx)=>{ groups[idx % state.groupCount].teamIds.push(id); });
  return groups;
}

function roundRobinPairs(teamIds){
  let ids = teamIds.slice();
  if(ids.length % 2 !== 0) ids.push(null);
  const n = ids.length;
  const rounds = [];
  const fixed = ids[0];
  let rest = ids.slice(1);
  for(let r=0;r<n-1;r++){
    const current = [fixed, ...rest];
    const round = [];
    for(let i=0;i<n/2;i++){
      const a = current[i], b = current[n-1-i];
      if(a!==null && b!==null) round.push([a,b]);
    }
    rounds.push(round);
    rest.unshift(rest.pop());
  }
  return rounds;
}

function generateSchedule(){
  if(state.teams.length < 2){ showToast('Mindestens 2 Teams hinzufügen'); return; }
  if(state.groupCount < 1){ showToast('Mindestens 1 Gruppe angeben'); return; }
  state.groups = assignGroups();
  const matches = [];
  state.groups.forEach(group=>{
    const rounds = roundRobinPairs(group.teamIds);
    rounds.forEach((round, rIdx)=>{
      round.forEach(([a,b])=>{
        matches.push({
          id: uid('m'), phase:'group', groupId: group.id,
          matchday: rIdx+1, teamA:a, teamB:b,
          scoreA:0, scoreB:0, status:'pending', updatedAt:0
        });
      });
    });
  });
  state.matches = matches;
  state.phase = 'group';
  saveState();
  renderApp();
  showToast('Spielplan erstellt');
}

function computeStandings(group){
  const rows = {};
  group.teamIds.forEach(id=>{
    rows[id] = { id, name: teamName(id), sp:0,s:0,u:0,n:0,tf:0,tg:0,pkt:0 };
  });
  state.matches.filter(m=>m.groupId===group.id && m.status==='finished').forEach(m=>{
    const a = rows[m.teamA], b = rows[m.teamB];
    if(!a||!b) return;
    a.sp++; b.sp++;
    a.tf += m.scoreA; a.tg += m.scoreB;
    b.tf += m.scoreB; b.tg += m.scoreA;
    if(m.scoreA>m.scoreB){ a.s++; b.n++; a.pkt+=3; }
    else if(m.scoreA<m.scoreB){ b.s++; a.n++; b.pkt+=3; }
    else { a.u++; b.u++; a.pkt+=1; b.pkt+=1; }
  });
  return Object.values(rows).sort((x,y)=>{
    if(y.pkt!==x.pkt) return y.pkt-x.pkt;
    const dx = x.tf-x.tg, dy = y.tf-y.tg;
    if(dy!==dx) return dy-dx;
    if(y.tf!==x.tf) return y.tf-x.tf;
    return x.name.localeCompare(y.name);
  });
}

function allGroupMatchesPlayed(){
  return state.matches.filter(m=>m.phase==='group').every(m=>m.status==='finished');
}

function seedPositions(size){
  let seeds=[1];
  while(seeds.length<size){
    const l = seeds.length*2;
    const next=[];
    seeds.forEach(s=>{ next.push(s); next.push(l+1-s); });
    seeds = next;
  }
  return seeds;
}
function nextPow2(n){ let p=1; while(p<n) p*=2; return Math.max(p,2); }

function roundNameForCount(count){
  if(count===1) return 'Finale';
  if(count===2) return 'Halbfinale';
  if(count===4) return 'Viertelfinale';
  if(count===8) return 'Achtelfinale';
  if(count===16) return 'Sechzehntelfinale';
  return 'Runde der letzten ' + (count*2);
}

function buildKnockoutFromSelection(qualifiedIds){
  const size = nextPow2(qualifiedIds.length);
  const seeds = seedPositions(size);
  const slots = seeds.map(s => (s<=qualifiedIds.length ? qualifiedIds[s-1] : null));
  const matches = [];
  for(let i=0;i<size/2;i++){
    const a = slots[2*i], b = slots[2*i+1];
    const isBye = (a===null || b===null);
    matches.push({
      id: uid('k'), teamA:a, teamB:b,
      scoreA: 0, scoreB: 0,
      status: isBye ? 'finished' : 'pending', winner: isBye ? (a||b) : null,
      bye: isBye, updatedAt: Date.now()
    });
  }
  state.knockout.rounds = [{ name: roundNameForCount(matches.length), matches }];
  state.phase = 'knockout';
  saveState();
  renderApp();
}

function currentKORound(){
  const rounds = state.knockout.rounds;
  return rounds[rounds.length-1];
}
function koRoundComplete(round){
  return round.matches.every(m=>m.status==='finished' && m.winner);
}
function generateNextKORound(){
  const round = currentKORound();
  if(!koRoundComplete(round)){ showToast('Erst alle Spiele dieser Runde abschließen'); return; }
  if(round.matches.length===1){
    state.champion = round.matches[0].winner;
    state.phase = 'finished';
    saveState(); renderApp();
    return;
  }
  const winners = round.matches.map(m=>m.winner);
  const matches = [];
  for(let i=0;i<winners.length;i+=2){
    matches.push({
      id: uid('k'), teamA:winners[i], teamB:winners[i+1],
      scoreA:0, scoreB:0, status:'pending', winner:null, bye:false, updatedAt:Date.now()
    });
  }
  state.knockout.rounds.push({ name: roundNameForCount(matches.length), matches });
  saveState(); renderApp();
}

/* =========================================================
   RENDER: SHELL
========================================================= */
const PHASE_LABEL = {
  setup: 'Vorbereitung', group: 'Gruppenphase', 'knockout-select': 'K.O.-Auswahl',
  knockout: 'K.O.-Phase', finished: 'Turnier beendet'
};

function renderApp(){
  document.getElementById('phase-pill').textContent = PHASE_LABEL[state.phase] || '';
  const nameSlot = document.getElementById('brand-name-slot');
  if(currentTab==='admin' && adminUnlocked){
    nameSlot.innerHTML = `<input type="text" value="${escapeAttr(state.tournamentName)}" oninput="renameTournament(this.value)" aria-label="Turniername">`;
  } else {
    nameSlot.innerHTML = `<div class="brand-name">${escapeHtml(state.tournamentName)}</div>`;
  }
  document.querySelectorAll('#main-nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });

  const root = document.getElementById('view-root');
  if(currentTab==='ticker') root.innerHTML = renderTicker();
  else if(currentTab==='player') root.innerHTML = renderPlayer();
  else root.innerHTML = renderAdmin();

  applyScorePulses();
}

function renameTournament(v){ state.tournamentName = v || 'Turnier'; saveState(); }

function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* score pulse animation: compare against snapshot */
function applyScorePulses(){
  document.querySelectorAll('[data-score-key]').forEach(el=>{
    const key = el.getAttribute('data-score-key');
    const val = el.getAttribute('data-score-val');
    if(lastScoreSnapshot[key] !== undefined && lastScoreSnapshot[key] !== val){
      el.classList.add('pulse');
      setTimeout(()=>el.classList.remove('pulse'), 650);
    }
    lastScoreSnapshot[key] = val;
  });
}

function flipTile(val){ return `<span class="flip-tile">${val===null||val===undefined?'–':val}</span>`; }
function scorePair(key,a,b){
  return `<span class="score-row" data-score-key="${key}" data-score-val="${a}-${b}">
    ${flipTile(a)}<span class="score-sep">:</span>${flipTile(b)}
  </span>`;
}

/* =========================================================
   RENDER: TICKER (big-screen live view)
========================================================= */
function renderTicker(){
  const recent = state.matches
    .filter(m=>m.status==='live' || m.status==='finished')
    .concat(state.knockout.rounds.flatMap(r=>r.matches.filter(m=>!m.bye && (m.status==='live' || m.status==='finished'))))
    .sort((a,b)=>{
      // live matches always float to the front, then most recently updated first
      if(a.status==='live' && b.status!=='live') return -1;
      if(b.status==='live' && a.status!=='live') return 1;
      return (b.updatedAt||0)-(a.updatedAt||0);
    })
    .slice(0,16);

  const marquee = recent.length ? `
    <div class="marquee-wrap">
      <div class="marquee-label"><span class="marquee-dot"></span>LIVE</div>
      <div class="marquee-track">
        ${[...recent,...recent].map(m=>`
          <span class="marquee-item">${m.status==='live'?'<span class=\"marquee-dot\" style=\"background:var(--live);width:6px;height:6px;\"></span>':''}<b>${escapeHtml(teamName(m.teamA))}</b> ${m.scoreA} : ${m.scoreB} <b>${escapeHtml(teamName(m.teamB))}</b>${m.status==='finished'?' <span style=\"color:var(--text-faint);\">FT</span>':''}</span>
        `).join('')}
      </div>
    </div>` : `
    <div class="marquee-wrap"><div class="marquee-empty">Noch keine Ergebnisse — sobald ein Tor eingetragen wird, läuft es hier sofort durch.</div></div>`;

  let body = '';
  if(state.phase==='setup'){
    body = emptyState('🏟️','Turnier wird vorbereitet','Sobald der Spielplan steht, erscheinen hier live alle Ergebnisse.');
  } else if(state.phase==='group' || state.phase==='knockout-select'){
    body = groupsGrid(true);
  } else if(state.phase==='knockout' || state.phase==='finished'){
    body = `
      ${state.phase==='finished' ? championBanner() : ''}
      <div class="section-head"><div class="eyebrow">K.O.-Runde</div><h2>Turnierbaum</h2></div>
      ${renderBracket(false)}
      <div class="section-head" style="margin-top:28px;"><div class="eyebrow">Rückblick</div><h2>Gruppenphase</h2></div>
      ${groupsGrid(true)}
    `;
  }
  return marquee + body;
}

/* =========================================================
   RENDER: PLAYER (public overview)
========================================================= */
function renderPlayer(){
  let html = `<div class="section-head">
    <div class="eyebrow">Öffentliche Übersicht</div>
    <h2>${escapeHtml(state.tournamentName)}</h2>
    <p class="muted">${state.teams.length} Teams · ${state.groups.length || state.groupCount} Gruppen · Status: ${PHASE_LABEL[state.phase]}</p>
  </div>`;

  if(state.phase==='setup'){
    html += emptyState('👋','Noch keine Anmeldungen sichtbar','Das Turnier wird gerade eingerichtet — schau später nochmal vorbei.');
    return html;
  }

  html += `<div class="search-box"><input type="text" id="player-search" placeholder="Team suchen…" oninput="filterPlayerTeams(this.value)"></div>`;
  html += `<div id="player-teams" class="card"><h3>Teilnehmende Teams</h3><div class="team-list" id="player-team-list">${
    state.teams.map(t=>`<div class="team-row" data-team-name="${escapeAttr(t.name.toLowerCase())}"><div class="avatar">${teamInitials(t.name)}</div><span>${escapeHtml(t.name)}</span></div>`).join('')
  }</div></div>`;

  html += `<div class="section-head" style="margin-top:24px;"><div class="eyebrow">Gruppenphase</div><h2>Tabellen &amp; Spielplan</h2></div>`;
  html += groupsGrid(true);

  if(state.phase==='knockout' || state.phase==='finished'){
    if(state.phase==='finished') html += championBanner();
    html += `<div class="section-head" style="margin-top:28px;"><div class="eyebrow">Finalrunde</div><h2>Turnierbaum</h2></div>`;
    html += renderBracket(false);
  }
  return html;
}
function filterPlayerTeams(q){
  const query = q.trim().toLowerCase();
  document.querySelectorAll('#player-team-list .team-row').forEach(row=>{
    row.style.display = row.dataset.teamName.includes(query) ? 'flex' : 'none';
  });
}

/* shared: groups + standings + fixtures */
function groupsGrid(readOnly){
  if(!state.groups.length) return emptyState('📋','Noch kein Spielplan','Der Spielplan wird nach Erstellung hier angezeigt.');
  return `<div class="grid grid-2">` + state.groups.map(g=>groupCard(g, readOnly)).join('') + `</div>`;
}

function groupCard(group, readOnly){
  const standings = computeStandings(group);
  const matches = state.matches.filter(m=>m.groupId===group.id).sort((a,b)=>a.matchday-b.matchday);
  const qualifiedIds = new Set(state.groups.length && state.phase!=='setup' ? standings.slice(0,state.advancePerGroup).map(r=>r.id) : []);
  const showQualified = state.phase!=='group' || allGroupMatchesPlayed();

  return `
  <div class="card group-card">
    <h3><span>${escapeHtml(group.name)}</span><span class="muted" style="font-size:12px;font-weight:400;">${group.teamIds.length} Teams</span></h3>
    <table>
      <thead><tr><th>#</th><th>Team</th><th class="num-col">Sp</th><th class="num-col">S</th><th class="num-col">U</th><th class="num-col">N</th><th class="num-col">Tore</th><th class="num-col">Diff</th><th class="num-col">Pkt</th></tr></thead>
      <tbody>
        ${standings.map((r,i)=>`
          <tr class="standings-row ${showQualified && qualifiedIds.has(r.id) ? 'qualified':''}">
            <td class="num-col">${i+1}</td>
            <td>${escapeHtml(r.name)}</td>
            <td class="num-col tabular">${r.sp}</td>
            <td class="num-col tabular">${r.s}</td>
            <td class="num-col tabular">${r.u}</td>
            <td class="num-col tabular">${r.n}</td>
            <td class="num-col tabular">${r.tf}:${r.tg}</td>
            <td class="num-col tabular">${r.tf-r.tg>0?'+':''}${r.tf-r.tg}</td>
            <td class="num-col tabular"><b>${r.pkt}</b></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div style="margin-top:14px;">
      ${matches.map(m=>matchLine(m, readOnly)).join('')}
    </div>
  </div>`;
}

function matchLine(m, readOnly){
  const key = 'group-'+m.id;
  const showScore = m.status !== 'pending';
  const scoreHtml = showScore
    ? scorePair(key, m.scoreA, m.scoreB)
    : `<span class="score-row">${flipTile('–')}<span class="score-sep">:</span>${flipTile('–')}</span>`;

  let actions = statusTag(m.status);
  if(!readOnly){
    const locked = m.status==='finished';
    actions = `
      <div class="goal-controls">
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustGroupGoal('${m.id}','A',-1)" aria-label="Tor ${teamName(m.teamA)} zurücknehmen">–</button>
        <span class="tabular goal-count">${m.scoreA}</span>
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustGroupGoal('${m.id}','A',1)" aria-label="Tor für ${teamName(m.teamA)}">+</button>
      </div>
      <span class="score-sep">:</span>
      <div class="goal-controls">
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustGroupGoal('${m.id}','B',-1)" aria-label="Tor ${teamName(m.teamB)} zurücknehmen">–</button>
        <span class="tabular goal-count">${m.scoreB}</span>
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustGroupGoal('${m.id}','B',1)" aria-label="Tor für ${teamName(m.teamB)}">+</button>
      </div>
      ${statusTag(m.status)}
      ${!locked ? `<button class="btn btn-sm btn-primary" onclick="finishGroupMatch('${m.id}')">Beenden</button>` : ''}
    `;
  }
  return `
    <div class="match-line">
      <div class="match-teams">
        <span>${escapeHtml(teamName(m.teamA))} <span class="vs">vs</span> ${escapeHtml(teamName(m.teamB))}</span>
        <span class="muted" style="font-size:11px;">Spieltag ${m.matchday}</span>
      </div>
      <div class="match-actions">${readOnly ? scoreHtml : ''}${actions}</div>
    </div>`;
}

function statusTag(status){
  if(status==='finished') return `<span class="tag tag-done">Beendet</span>`;
  if(status==='live') return `<span class="tag tag-live"><span class="marquee-dot" style="background:var(--live);width:6px;height:6px;display:inline-block;vertical-align:middle;margin-right:4px;"></span>Live</span>`;
  return `<span class="tag tag-pending">Bereit</span>`;
}

function adjustGroupGoal(matchId, team, delta){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m || m.status==='finished') return;
  if(team==='A') m.scoreA = Math.max(0, (m.scoreA||0) + delta);
  else m.scoreB = Math.max(0, (m.scoreB||0) + delta);
  if(m.status==='pending') m.status='live';
  m.updatedAt = Date.now();
  saveState();
  renderApp();
}
function finishGroupMatch(matchId){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m) return;
  m.status = 'finished';
  m.updatedAt = Date.now();
  saveState();
  renderApp();
  showToast('Spiel beendet · Tabelle aktualisiert');
}

function championBanner(){
  const name = teamName(state.champion);
  return `<div class="champion-banner"><div class="trophy">🏆</div><div class="eyebrow" style="color:var(--live)">Turniersieger</div><h2>${escapeHtml(name)}</h2></div>`;
}

/* bracket rendering, shared between admin/ticker/player. editable=true shows score inputs + winner pick */
function renderBracket(editable){
  if(!state.knockout.rounds.length) return emptyState('🥊','K.O.-Runde noch nicht erstellt','Sobald die Gruppenphase abgeschlossen ist, entsteht hier der Turnierbaum.');
  return `<div class="bracket">${state.knockout.rounds.map(round=>`
    <div class="bracket-round">
      <div class="bracket-round-title">${round.name}</div>
      ${round.matches.map(m=>bracketMatch(m, editable)).join('')}
    </div>
  `).join('')}</div>`;
}

function bracketMatch(m, editable){
  const key = 'ko-'+m.id;
  if(m.bye){
    return `<div class="bmatch">
      <div class="bmatch-team winner">${escapeHtml(teamName(m.winner))} <span class="tag tag-done" style="margin-left:4px;">Freilos</span></div>
    </div>`;
  }
  const rowA = bracketTeamRow(m,'A',editable,key);
  const rowB = bracketTeamRow(m,'B',editable,key);
  const bothSet = !!(m.teamA && m.teamB);
  let footer = '';
  if(editable && bothSet){
    footer = `<div class="bmatch-div"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;">${statusTag(m.status)}${m.status!=='finished' ? `<button class="btn btn-sm btn-primary" onclick="finishKOMatch('${m.id}')">Beenden</button>` : ''}</div>`;
  } else if(!editable && bothSet && m.status!=='pending'){
    footer = `<div class="bmatch-div"></div><div style="padding-top:6px;text-align:center;">${statusTag(m.status)}</div>`;
  }
  return `<div class="bmatch" data-score-key="${key}" data-score-val="${m.scoreA}-${m.scoreB}-${m.status}">${rowA}<div class="bmatch-div"></div>${rowB}${footer}</div>`;
}

function bracketTeamRow(m, slot, editable, key){
  const teamId = slot==='A'? m.teamA : m.teamB;
  const score = slot==='A'? m.scoreA : m.scoreB;
  const isWinner = m.winner && m.winner===teamId;
  if(!teamId){
    return `<div class="bmatch-team tbd">TBD</div>`;
  }
  const locked = m.status==='finished';
  const bothSet = !!(m.teamA && m.teamB);
  const showScore = m.status !== 'pending';
  let scoreControl;
  if(editable && bothSet){
    scoreControl = `<span class="goal-controls">
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustKOGoal('${m.id}','${slot}',-1)" aria-label="Tor zurücknehmen">–</button>
        <span class="tabular goal-count">${score}</span>
        <button class="btn btn-sm goal-btn" ${locked?'disabled':''} onclick="adjustKOGoal('${m.id}','${slot}',1)" aria-label="Tor">+</button>
      </span>`;
  } else {
    scoreControl = showScore ? `<span class="bmatch-score">${score}</span>` : '';
  }
  let pickBtn = '';
  if(editable && locked && !m.winner){
    pickBtn = `<button class="pick" onclick="pickWinner('${m.id}','${teamId}')">Sieger</button>`;
  }
  return `<div class="bmatch-team ${isWinner?'winner':''}">
    <span>${escapeHtml(teamName(teamId))} ${isWinner?'✓':''}</span>
    <span style="display:flex;gap:8px;align-items:center;">${scoreControl}${pickBtn}</span>
  </div>`;
}

function adjustKOGoal(matchId, slot, delta){
  const round = state.knockout.rounds.find(r=>r.matches.some(m=>m.id===matchId));
  const m = round.matches.find(x=>x.id===matchId);
  if(!m || m.status==='finished') return;
  if(slot==='A') m.scoreA = Math.max(0, (m.scoreA||0) + delta);
  else m.scoreB = Math.max(0, (m.scoreB||0) + delta);
  if(m.status==='pending') m.status='live';
  m.updatedAt = Date.now();
  saveState();
  renderApp();
}
function finishKOMatch(matchId){
  const round = state.knockout.rounds.find(r=>r.matches.some(m=>m.id===matchId));
  const m = round.matches.find(x=>x.id===matchId);
  if(!m) return;
  m.status = 'finished';
  m.updatedAt = Date.now();
  if(m.scoreA !== m.scoreB){
    m.winner = m.scoreA > m.scoreB ? m.teamA : m.teamB;
  }
  saveState();
  renderApp();
  showToast(m.winner ? teamName(m.winner) + ' kommt weiter' : 'Unentschieden — bitte Sieger per Klick festlegen');
}
function pickWinner(matchId, teamId){
  const round = state.knockout.rounds.find(r=>r.matches.some(m=>m.id===matchId));
  const m = round.matches.find(x=>x.id===matchId);
  m.winner = teamId;
  saveState();
  renderApp();
  showToast(teamName(teamId) + ' kommt weiter');
}

function emptyState(icon,title,text){
  return `<div class="card empty-state"><div class="big">${icon}</div><h3>${title}</h3><p class="muted">${text}</p></div>`;
}

/* =========================================================
   RENDER: ADMIN
========================================================= */
function renderAdmin(){
  if(!adminUnlocked){
    return `
    <div class="lock-screen">
      <div class="card">
        <div class="eyebrow">Admin-Bereich</div>
        <h3>PIN eingeben</h3>
        <p class="muted" style="margin-bottom:14px;">Nur zum Schutz vor versehentlichen Änderungen — kein Sicherheitsmechanismus.</p>
        <div class="inline-form">
          <input type="password" id="admin-pin-input" placeholder="PIN">
          <button class="btn btn-primary" onclick="tryUnlock()">Freischalten</button>
        </div>
      </div>
    </div>`;
  }

  const steps = ['setup','group','knockout-select','knockout','finished'];
  const stepLabels = { setup:'Vorbereitung', group:'Gruppenphase', 'knockout-select':'K.O.-Auswahl', knockout:'K.O.-Phase', finished:'Fertig' };
  const currentIdx = steps.indexOf(state.phase);

  let stepsHtml = `<div class="steps">` + steps.map((s,i)=>{
    const cls = i===currentIdx ? 'current' : (i<currentIdx ? 'done':'');
    return `<span class="step-pill ${cls}">${i+1}. ${stepLabels[s]}</span>`;
  }).join('') + `</div>`;

  let body = '';
  if(state.phase==='setup') body = adminSetup();
  else if(state.phase==='group') body = adminGroupPhase();
  else if(state.phase==='knockout-select') body = adminKnockoutSelect();
  else if(state.phase==='knockout') body = adminKnockoutPhase();
  else if(state.phase==='finished') body = adminFinished();

  return stepsHtml + body + adminDangerZone();
}

function tryUnlock(){
  const val = document.getElementById('admin-pin-input').value;
  if(val === state.adminPin){
    adminUnlocked = true;
    renderApp();
  } else {
    showToast('Falscher PIN');
  }
}

function adminSetup(){
  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="eyebrow">Schritt 1</div><h3>Teams anlegen</h3>
      <div class="inline-form">
        <input type="text" id="new-team-name" placeholder="Teamname" onkeydown="if(event.key==='Enter')addTeam()">
        <button class="btn btn-primary" onclick="addTeam()">Hinzufügen</button>
      </div>
      <div class="team-list">
        ${state.teams.length ? state.teams.map(t=>`
          <div class="team-row">
            <div class="avatar">${teamInitials(t.name)}</div>
            <span>${escapeHtml(t.name)}</span>
            <button class="btn btn-sm btn-danger" onclick="removeTeam('${t.id}')">Entfernen</button>
          </div>`).join('') : `<p class="muted">Noch keine Teams — leg oben das erste an.</p>`}
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">Schritt 2</div><h3>Turnierformat</h3>
      <div class="field-row">
        <label for="group-count">Anzahl Gruppen</label>
        <input type="number" min="1" max="16" id="group-count" value="${state.groupCount}" oninput="state.groupCount=parseInt(this.value)||1">
      </div>
      <div class="field-row">
        <label for="advance-count">Teams pro Gruppe, die weiterkommen</label>
        <input type="number" min="1" max="8" id="advance-count" value="${state.advancePerGroup}" oninput="state.advancePerGroup=parseInt(this.value)||1">
      </div>
      <p class="muted" style="margin:14px 0;">${state.teams.length} Teams · ${state.groupCount} Gruppen · Gruppengröße ≈ ${state.teams.length?Math.ceil(state.teams.length/state.groupCount):0}</p>
      <button class="btn btn-primary btn-block" ${state.teams.length<2?'disabled':''} onclick="generateSchedule()">Spielplan automatisch erstellen</button>

  </div>`;
}
function addTeam(){
  const input = document.getElementById('new-team-name');
  const name = input.value.trim();
  if(!name) return;
  state.teams.push({ id: uid('t'), name });
  input.value='';
  saveState();
  renderApp();
  document.getElementById('new-team-name')?.focus();
}
function removeTeam(id){
  state.teams = state.teams.filter(t=>t.id!==id);
  saveState();
  renderApp();
}

function adminGroupPhase(){
  const complete = allGroupMatchesPlayed();
  return `
    <div class="section-head"><div class="eyebrow">Schritt 3</div><h2>Tore eintragen</h2><p class="muted">Ergebnisse erscheinen sofort live im Ticker und bei den Spielern.</p></div>
    ${groupsGrid(false)}
    <div class="card" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <h3>Gruppenphase abschließen</h3>
        <p class="muted">${complete? 'Alle Spiele sind eingetragen — bereit für die K.O.-Auswahl.' : 'Es sind noch nicht alle Spiele gespielt. Du kannst trotzdem vorzeitig abschließen.'}</p>
      </div>
      <button class="btn btn-primary" onclick="goToKnockoutSelect()">Weiter zur K.O.-Auswahl</button>
    </div>
  `;
}
function goToKnockoutSelect(){
  state.phase = 'knockout-select';
  saveState();
  renderApp();
}

function adminKnockoutSelect(){
  const selections = state.groups.map(g=>{
    const standings = computeStandings(g);
    return { group: g, standings };
  });
  window._selectionState = window._selectionState || {};
  selections.forEach(({group,standings})=>{
    if(!window._selectionState[group.id]){
      window._selectionState[group.id] = new Set(standings.slice(0,state.advancePerGroup).map(r=>r.id));
    }
  });

  const totalSelected = Object.values(window._selectionState).reduce((s,set)=>s+set.size,0);

  return `
    <div class="section-head"><div class="eyebrow">Schritt 4</div><h2>Wer kommt weiter?</h2><p class="muted">Vorausgewählt sind die Top ${state.advancePerGroup} je Gruppe — per Klick anpassbar.</p></div>
    <div class="grid grid-2">
      ${selections.map(({group,standings})=>`
        <div class="card">
          <h3>${escapeHtml(group.name)}</h3>
          ${standings.map(r=>`
            <label class="qual-check">
              <input type="checkbox" ${window._selectionState[group.id].has(r.id)?'checked':''}
                onchange="toggleQualify('${group.id}','${r.id}',this.checked)">
              <span style="flex:1;">${escapeHtml(r.name)}</span>
              <span class="muted tabular" style="font-size:12px;">${r.pkt} Pkt</span>
            </label>
          `).join('')}
        </div>
      `).join('')}
    </div>
    <div class="card" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <h3>K.O.-Baum erstellen</h3>
        <p class="muted">${totalSelected} Teams ausgewählt. Bei einer ungeraden Zahl oder nicht Zweierpotenz werden automatisch Freilose vergeben.</p>
      </div>
      <button class="btn btn-primary" ${totalSelected<2?'disabled':''} onclick="confirmKnockoutSelection()">K.O.-Phase starten</button>
    </div>
  `;
}
function toggleQualify(groupId, teamId, checked){
  const set = window._selectionState[groupId];
  if(checked) set.add(teamId); else set.delete(teamId);
}
function confirmKnockoutSelection(){
  let qualified = [];
  state.groups.forEach(g=>{
    const set = window._selectionState[g.id] || new Set();
    const standings = computeStandings(g).filter(r=>set.has(r.id));
    qualified = qualified.concat(standings.map(r=>r.id));
  });
  if(qualified.length<2){ showToast('Mindestens 2 Teams auswählen'); return; }
  buildKnockoutFromSelection(qualified);
  showToast('K.O.-Baum erstellt');
}

function adminKnockoutPhase(){
  const round = currentKORound();
  const complete = koRoundComplete(round);
  return `
    <div class="section-head"><div class="eyebrow">Schritt 5</div><h2>K.O.-Phase</h2><p class="muted">Ergebnis eintragen, dann Sieger per Klick markieren — er zieht automatisch in die nächste Runde ein.</p></div>
    ${renderBracket(true)}
    <div class="card" style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <h3>${round.name} ${complete?'abgeschlossen':'läuft'}</h3>
        <p class="muted">${complete? (round.matches.length===1 ? 'Bereit, den Sieger zu küren.' : 'Bereit für die nächste Runde.') : 'Alle Spiele dieser Runde müssen ein Ergebnis und einen Sieger haben.'}</p>
      </div>
      <button class="btn btn-primary" ${!complete?'disabled':''} onclick="generateNextKORound()">${round.matches.length===1 ? 'Turnier beenden' : 'Nächste Runde erstellen'}</button>
    </div>
  `;
}

function adminFinished(){
  return `
    ${championBanner()}
    ${renderBracket(false)}
    <div class="card" style="margin-top:16px;">
      <h3>Turnier abgeschlossen</h3>
      <p class="muted">Starte ein neues Turnier über die Reset-Funktion unten.</p>
    </div>
  `;
}

function adminDangerZone(){
  return `
    <div class="card" style="margin-top:28px;border-color:var(--danger);">
      <h3 style="color:var(--danger);">Gefahrenzone</h3>
      <p class="muted">Setzt das gesamte Turnier zurück — Teams, Spielplan und Ergebnisse gehen verloren.</p>
      <button class="btn btn-danger" onclick="resetTournament()">Turnier zurücksetzen</button>
    </div>
  `;
}
function resetTournament(){
  if(!confirm('Wirklich das gesamte Turnier zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
  const name = state.tournamentName;
  const pin = state.adminPin;
  state = defaultState();
  state.tournamentName = name;
  state.adminPin = pin;
  window._selectionState = {};
  saveState();
  renderApp();
  showToast('Turnier zurückgesetzt');
}

/* =========================================================
   INIT + POLLING + NAV
========================================================= */
document.getElementById('main-nav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  renderApp();
});

function isEditingInput(){
  const el = document.activeElement;
  return el && (el.tagName==='INPUT' || el.tagName==='SELECT');
}

async function pollForUpdates(){
  try{
    const remote = await loadState(true);
    if(remote && remote.updatedAt && (!state || remote.updatedAt > state.updatedAt)){
      if(currentTab==='admin' && isEditingInput()){
        return; // avoid clobbering an in-progress edit
      }
      state = remote;
      renderApp();
    }
  }catch(e){ /* silent */ }
}

async function init(){
  state = await loadState(false);
  renderApp();
  pollTimer = setInterval(pollForUpdates, 2500);
}
init();
</script>
</body>
